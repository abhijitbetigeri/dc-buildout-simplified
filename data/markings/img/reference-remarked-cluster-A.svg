<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="440" height="210" role="img" aria-labelledby="t d">
<title id="t">Remarked module reference pattern, cluster A</title><desc id="d">Abstract signature of a remarked DDR5 RDIMM: abraded and overprinted package marking, wrong glyph profile, absent 2D code, blank serial, blank SPD assembler bytes, inconsistent date code.</desc>
<!-- LINEDOWN beat-5 marking fixture. Hand-authored schematic, NOT a photograph.
     viewBox is locked at 0 0 440 210 (~2.1:1). To swap in a real DIMM photograph, replace this
     file's contents keeping the SAME filename, or drop a same-stem .png beside it. The event log
     (data/mock-events.json e036/e037) references the .svg path and must not be edited. -->
<rect width="440" height="210" fill="#0d1f17"/>
<rect x="6" y="6" width="428" height="198" rx="4" fill="none" stroke="#17412e"/>
<rect x="16" y="14" width="408" height="26" rx="3" fill="#b3261e"/><text x="26" y="32" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" letter-spacing="1.2" fill="#fff">REMARKED PATTERN — REFERENCE CLUSTER A</text><rect x="16" y="48" width="408" height="22" rx="2" fill="#12291e"/><text x="26" y="63" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" fill="#ff8a65">SURFACE</text><text x="112" y="63" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#dfe8e2">abraded patch, ink overprint where OEM laser-etches</text><rect x="16" y="73" width="408" height="22" rx="2" fill="#12291e"/><text x="26" y="88" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" fill="#ff8a65">GLYPHS</text><text x="112" y="88" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#dfe8e2">generic typeface, character pitch 10-15% wide</text><rect x="16" y="98" width="408" height="22" rx="2" fill="#12291e"/><text x="26" y="113" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" fill="#ff8a65">2D CODE</text><text x="112" y="113" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#dfe8e2">DataMatrix absent or unreadable</text><rect x="16" y="123" width="408" height="22" rx="2" fill="#12291e"/><text x="26" y="138" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" fill="#ff8a65">SERIAL</text><text x="112" y="138" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#dfe8e2">blank / zeroed / repeated across sampled units</text><rect x="16" y="148" width="408" height="22" rx="2" fill="#12291e"/><text x="26" y="163" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" fill="#ff8a65">SPD</text><text x="112" y="163" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#dfe8e2">vendor ID present, assembler + serial bytes blank</text><rect x="16" y="173" width="408" height="22" rx="2" fill="#12291e"/><text x="26" y="188" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="700" fill="#ff8a65">DATE CODE</text><text x="112" y="188" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#dfe8e2">inconsistent with module PCB revision</text><text x="16" y="202" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="8" fill="#9fc7b1">SIGNATURE ONLY · NOT A SPECIFIC PART OR LOT · ILLUSTRATIVE</text>
</svg>
